name: Claude

# Claude picks up work when you:
# - add the "claude" label to an issue, or
# - mention @claude in an issue, issue comment or PR review comment.
# Only people with write access to the repo can trigger it.
# Claude tracks progress with status labels: in progress, needs info, ready for review.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Claude changes status labels as it works. Only the "claude" label starts a run.
    if: github.event_name != 'issues' || github.event.label.name == 'claude'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude"
          # Lets Claude set the status labels described in CLAUDE.md.
          claude_args: |
            --allowedTools "Bash(gh issue edit:*)"
